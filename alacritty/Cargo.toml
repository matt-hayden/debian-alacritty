[package]
name = "alacritty"
version = "0.16.1"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
license = "Apache-2.0"
description = "A fast, cross-platform, OpenGL terminal emulator"
readme = "README.md"
homepage = "https://alacritty.org"
repository = "https://github.com/alacritty/alacritty"
edition.workspace = true
rust-version.workspace = true

[dependencies.alacritty_terminal]
path = "../alacritty_terminal"
version = "0.25.1"

[dependencies.alacritty_config_derive]
path = "../alacritty_config_derive"
version = "0.2.5"

[dependencies.alacritty_config]
path = "../alacritty_config"
version = "0.2.3"

[dependencies]
ahash = { version = "0.8.6", features = ["no-rng"] }
bitflags = "2.2.1"
clap = { version = "4.2.7", features = ["derive", "env"] }
copypasta = { version = "0.10.1", default-features = false }
crossfont = "0.8.1"
glutin = { version = "0.32.2", default-features = false, features = ["egl", "wgl"] }
home = "0.5.5"
libc = "0.2"
log = { version = "0.4", features = ["std", "serde"] }
notify = "8.0.0"
parking_lot = "0.12.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.25"
tempfile = "3.12.0"
toml.workspace = true
toml_edit.workspace = true
unicode-width = "0.2.0"
winit = { version = "0.30.9", default-features = false, features = ["rwh_06", "serde"] }

[build-dependencies]
gl_generator = "0.14.0"

[dev-dependencies]
clap_complete = "4.2.3"

[target.'cfg(not(windows))'.dependencies]
xdg = "3.0.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = { version = "0.17.5", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSString",
    "NSLocale",
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSColorSpace",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
dirs = "6.0.0"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
]}

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.2"

[features]
default = ["wayland", "x11"]
x11 = [
    "copypasta/x11",
    "winit/x11",
    "glutin/x11",
    "glutin/glx",
    "png",
]
wayland = [
    "copypasta/wayland",
    "glutin/wayland",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita-crossfont",
]
nightly = []

[package.metadata.deb]
maintainer = "Michael Aaron Murphy <michael@system76.com>"
license-file = "LICENSE-APACHE"
depends = "$auto"
recommends = "xclip"
section = "x11"
priority = "optional"
extended-description-file = "extended-description"
assets = [
    ["target/release/alacritty", "usr/bin/", "755"],
    ["extra/linux/Alacritty.desktop", "usr/share/applications/", "644"],
    ["extra/linux/alacritty-wrapper", "usr/libexec/", "755"],
    ["extra/logo/*.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["extra/completions/alacritty.bash", "usr/share/bash-completion/completions/alacritty", "644"],
    ["extra/completions/_alacritty", "usr/share/zsh/vendor-completions/", "644"],
    ["extra/completions/alacritty.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["target/release/build/alacritty-*/out/terminfo/a/alacritty", "usr/share/terminfo/a", "644"],
    ["target/release/build/alacritty-*/out/terminfo/a/alacritty+common", "usr/share/terminfo/a", "644"],
    ["target/release/build/alacritty-*/out/terminfo/a/alacritty-direct", "usr/share/terminfo/a", "644"]
]
